<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // GitHub Pages 404 redirect workaround for client-side routing
      // Store the path in sessionStorage and redirect to index.html
      sessionStorage.setItem('redirect', location.pathname + location.search + location.hash);
       location.replace(location.origin + '/My-Learning-Diary/');
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
